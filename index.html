<index.html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Grammar Lab · 중등 영어 문법 학습</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f4f9; --card:#fff; --line:#e3e9f2; --txt:#1b2437; --sub:#6b7a90;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#e8f0ff;
  --green:#12a150; --red:#e2413f; --amber:#e08b00; --violet:#7c5cff;
  --shadow:0 1px 2px rgba(16,32,60,.05),0 8px 24px -12px rgba(16,32,60,.18);
  --r:16px;
}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh}

/* sidebar */
.side{width:242px;flex:0 0 242px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;gap:10px;align-items:center;padding:4px 10px 18px}
.logo .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#5b8cff);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 6px 14px -6px rgba(37,99,235,.9)}
.logo b{font-size:15px;letter-spacing:-.2px;display:block;line-height:1.2}
.logo span{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.4px}
.nav-t{font-size:11px;font-weight:800;color:#93a1b6;letter-spacing:.8px;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-weight:600;font-size:14px;color:#45536a;margin-bottom:2px;transition:.15s}
.nav a:hover{background:#f5f8fd;color:var(--blue)}
.nav a.on{background:var(--blue-l);color:var(--blue-d);font-weight:800}
.nav a .ic{font-size:15px;width:20px;text-align:center}
.nav a .badge{margin-left:auto;background:var(--blue);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px}
.side-foot{margin-top:16px;padding:12px;border-radius:12px;background:linear-gradient(160deg,#eef4ff,#f7faff);border:1px solid #dfe9fb}
.side-foot p{font-size:11.5px;color:var(--sub);line-height:1.5}
.side-foot b{color:var(--blue-d)}

/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(241,244,249,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top h1{font-size:17px;letter-spacing:-.3px}
.top .prog{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:#e2e9f4;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#5b9bff);border-radius:99px;transition:width .5s}
.prog small{font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#45536a}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;font-size:13px;font-weight:800}
.wrap{padding:24px 26px 70px;max-width:1120px;width:100%}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.side{display:none}.wrap{padding:18px 14px 60px}.top{padding:10px 14px}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-h h2{font-size:16px;letter-spacing:-.3px}
.sec-h .line{flex:1;height:1px;background:var(--line)}
.sec-h small{color:var(--sub);font-size:12px;font-weight:700}

/* hero */
.hero{background:linear-gradient(135deg,#1e4fd8,#3b7bff 55%,#6aa4ff);color:#fff;border-radius:22px;padding:28px 30px;position:relative;overflow:hidden;box-shadow:0 20px 40px -24px rgba(37,99,235,.85)}
.hero:after{content:"";position:absolute;right:-60px;top:-70px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;right:40px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h2{font-size:23px;letter-spacing:-.6px;margin-bottom:6px}
.hero p{opacity:.92;font-size:13.5px;max-width:520px}
.hero .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:11px;font-weight:800;font-size:13.5px;transition:.15s;border:1px solid transparent}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 10px 20px -12px rgba(37,99,235,.9)}
.btn.primary:hover{background:var(--blue-d);transform:translateY(-1px)}
.btn.ghost{background:#fff;border-color:var(--line);color:#3d4a60}
.btn.ghost:hover{border-color:#c9d6e8;background:#f8fbff}
.btn.white{background:#fff;color:var(--blue-d)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* stat tiles */
.tile{padding:16px 18px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.tile .lab{font-size:12px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:6px}
.tile .val{font-size:24px;font-weight:800;letter-spacing:-1px;margin-top:4px}
.tile .val small{font-size:12px;font-weight:700;color:var(--sub);margin-left:2px}
.tile.blue{background:linear-gradient(160deg,#eef4ff,#fff);border-color:#dbe7ff}

/* unit cards */
.unit{display:flex;gap:12px;padding:15px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.unit:hover{border-color:#b9cdf0;transform:translateY(-2px)}
.unit .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:#f2f6ff;flex:0 0 40px}
.unit .tt{font-weight:800;font-size:14px;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.unit .sb{font-size:12px;color:var(--sub);margin-top:2px}
.unit .mini{height:5px;background:#edf1f7;border-radius:9px;margin-top:9px;overflow:hidden}
.unit .mini>i{display:block;height:100%;background:var(--blue);border-radius:9px}
.unit .pct{font-size:11px;font-weight:800;color:var(--sub);margin-top:5px;display:flex;justify-content:space-between}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.2px}
.pill.basic{background:#e9f8ef;color:#0d7a3d}
.pill.mid2{background:#e9f0ff;color:#1e4fd8}
.pill.mid3{background:#fdecec;color:#c02b29}
.pill.soft{background:#f2f5fa;color:#5b6a80}

/* question */
.qcard{padding:24px 26px}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.qtext{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.55;margin-bottom:6px}
.qsub{font-size:13px;color:var(--sub);margin-bottom:18px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:11px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;font-weight:700;font-size:15px;transition:.13s}
.opt:hover:not(.locked){border-color:#b9cdf0;background:#f8fbff}
.opt .k{width:24px;height:24px;border-radius:7px;background:#f1f5fb;color:#5b6a80;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 24px}
.opt.right{border-color:#8ed8ab;background:#f2fdf6}
.opt.right .k{background:#12a150;color:#fff}
.opt.wrong{border-color:#f3b4b3;background:#fff5f5}
.opt.wrong .k{background:#e2413f;color:#fff}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.locked{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.65;border:1px solid}
.fb.ok{background:#f2fdf6;border-color:#c9eed8;color:#0d6a38}
.fb.no{background:#fff5f5;border-color:#fad4d3;color:#a52524}
.fb b{font-weight:800}
.fb .ex{display:block;margin-top:6px;color:#3d4a60;font-size:13px}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--blue-d)}
.timer.warn{color:var(--red);border-color:#fbd0cf;background:#fff5f5}

/* exam nav */
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.qnav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:800;color:#5b6a80}
.qnav button.done{background:var(--blue-l);border-color:#bcd2f8;color:var(--blue-d)}
.qnav button.cur{background:var(--blue);border-color:var(--blue);color:#fff}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11.5px;color:var(--sub);letter-spacing:.4px;font-weight:800;text-transform:uppercase}
td b{font-weight:800}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}

/* misc */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
input[type=text],input[type=number],select,textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#a9c4f2;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
label.fl{font-size:12px;font-weight:800;color:var(--sub);display:block;margin-bottom:6px;letter-spacing:.2px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:800;color:#5b6a80}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.empty{text-align:center;padding:44px 20px;color:var(--sub)}
.empty .e{font-size:34px;display:block;margin-bottom:10px;opacity:.7}
.rule{background:#f7faff;border:1px solid #e2ecfb;border-left:4px solid var(--blue);border-radius:10px;padding:13px 16px;font-size:14px;font-weight:700;color:#20304a}
.kv{font-size:13.5px;color:#3d4a60}
.kv b{color:var(--blue-d)}
.ex-list li{font-size:13.5px;padding:8px 0;border-bottom:1px dashed var(--line);list-style:none}
.ex-list li:last-child{border:0}
.ex-list .en{font-weight:800}
.ex-list .ko{color:var(--sub);font-size:12.5px;margin-left:4px}
.badge2{font-size:11px;font-weight:800;background:#f2f5fa;color:#5b6a80;padding:2px 7px;border-radius:6px}
.mono{font-variant-numeric:tabular-nums}
.done-tag{font-size:11px;font-weight:800;color:#12a150}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#111c30;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}

</style>

<script>
/* English Grammar Lab : pool.js
   - 매 시도마다 '다른 문제 지문'을 뽑기 위한 문제 풀 엔진
   - 일일 진도 / 어제 복습 잠금 계산 (순수 함수)
   브라우저(window.EGLPool) + Node(module.exports) 공용 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.EGLPool = api;
})(typeof window !== 'undefined' ? window : (typeof global !== 'undefined' ? global : this), function () {
  'use strict';

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim();
  }
  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function parseDay(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    return Date.UTC(+m[1], +m[2] - 1, +m[3]);
  }
  function addDays(s, n) {
    var t = parseDay(s);
    if (t == null) return null;
    return ymd(new Date(t + n * 86400000));
  }
  function daysBetween(a, b) {
    var x = parseDay(a), y = parseDay(b);
    if (x == null || y == null) return 0;
    return Math.round((y - x) / 86400000);
  }

  /* ---------- 문항 후보 만들기 ---------- */
  function fromGen(gen, uid, rounds) {
    var out = [];
    var tpl = (gen && gen[uid]) || [];
    if (!tpl.length) return out;
    rounds = rounds || Math.max(4, Math.ceil(24 / tpl.length));
    for (var r = 0; r < rounds; r++) {
      for (var i = 0; i < tpl.length; i++) {
        var res;
        try { res = tpl[i](); } catch (e) { continue; }
        if (!res || !res.q || !res.c || res.c.length !== 4) continue;
        var c = res.c.map(function (x) { return String(x); });
        if (new Set(c).size !== 4) continue;
        if (!res.e) continue;
        out.push({
          u: uid, d: res.d || 2, q: String(res.q),
          c: c.slice(), a: 0, e: String(res.e),
          gen: true, tid: i
        });
      }
    }
    return out;
  }

  function fromStatic(bank, uid) {
    return (bank || []).filter(function (q) { return q.u === uid; }).map(function (q) {
      return { u: q.u, d: q.d, q: q.q, c: q.c.slice(), a: q.a, e: q.e, gen: false, id: q.id };
    });
  }

  function poolSize(gen, bank, uid) {
    var m = {};
    dedupe(fromGen(gen, uid, 12).concat(fromStatic(bank, uid))).forEach(function (q) { m[norm(q.q)] = 1; });
    return Object.keys(m).length;
  }

  function dedupe(list) {
    var seen = {}, out = [];
    for (var i = 0; i < list.length; i++) {
      var k = list[i].u + '\u0001' + norm(list[i].q);
      if (seen[k]) continue;
      seen[k] = 1; out.push(list[i]);
    }
    return out;
  }

  /* ---------- 핵심: 안 본 지문 우선 뽑기 ---------- */
  function pick(cfg) {
    cfg = cfg || {};
    var units = cfg.units || [];
    var n = cfg.n || 10;
    var bank = cfg.staticBank || [];
    var gen = cfg.gen || {};
    var seen = cfg.seen || {};
    var diff = cfg.diff || 0;
    var rounds = cfg.rounds;

    var perUnit = {}, order = [];
    units.forEach(function (uid) {
      var cand = dedupe(fromGen(gen, uid, rounds).concat(fromStatic(bank, uid)));
      if (diff) cand = cand.filter(function (q) { return q.d === diff; });
      var sk = seen[uid] || [];
      var sset = {};
      sk.forEach(function (s) { sset[norm(s)] = 1; });
      var unseen = [], tired = [];
      cand.forEach(function (q) { (sset[norm(q.q)] ? tired : unseen).push(q); });
      /* 오래 전에 본 지문이 앞으로 오도록 정렬 (기록 순서 기준) */
      var rank = {};
      sk.forEach(function (s0, i) { rank[norm(s0)] = i; });
      tired.sort(function (a, b) { return (rank[norm(a.q)] || 0) - (rank[norm(b.q)] || 0); });
      perUnit[uid] = { unseen: shuffle(unseen), tired: tired };
      order.push(uid);
    });

    /* 유닛을 번갈아 가며 안 본 문제를 먼저 채운다 (전체 범위 출제 대비) */
    var picked = [], guard = 0;
    function take(uid, bucket) {
      var b = perUnit[uid][bucket];
      while (b.length) {
        var q = b.shift();
        if (diff && q.d !== diff) continue;
        return q;
      }
      return null;
    }
    while (picked.length < n && guard < n * 200) {
      guard++;
      var added = false;
      for (var i = 0; i < order.length && picked.length < n; i++) {
        var q1 = take(order[i], 'unseen');
        if (q1) { picked.push(q1); added = true; }
        else {
          var q2 = take(order[i], 'tired');
          if (q2) { picked.push(q2); added = true; }
        }
      }
      if (!added) break;
    }

    /* 보기 섞기 + 정답 위치 재계산 */
    return picked.slice(0, n).map(function (q) {
      var idx = [0, 1, 2, 3];
      if (cfg.optShuffle !== false) idx = shuffle(idx);
      var ch = idx.map(function (i) { return q.c[i]; });
      return {
        u: q.u, d: q.d, q: q.q, e: q.e, c: ch,
        a: idx.indexOf(q.a), gen: !!q.gen,
        id: q.gen ? ('g-' + q.u + '-' + hash(norm(q.q))) : q.id
      };
    });
  }

  /* ---------- 일일 진도 계산 ---------- */
  function plan(cfg) {
    cfg = cfg || {};
    var units = cfg.units || [];
    var perDay = Math.max(1, cfg.perDay || 2);
    var start = cfg.start || cfg.today;
    var today = cfg.today || start;
    var totalDays = Math.ceil(units.length / perDay);
    var dayIndex = Math.max(0, daysBetween(start, today));
    var from = dayIndex * perDay;
    var todayIds = units.slice(from, from + perDay);
    var prevIds = dayIndex > 0 ? units.slice((dayIndex - 1) * perDay, (dayIndex - 1) * perDay + perDay) : [];
    var backlog = [];
    for (var i = 0; i < Math.min(from, units.length); i++) backlog.push(units[i]);
    return {
      dayIndex: dayIndex, dayNo: Math.min(dayIndex + 1, totalDays), totalDays: totalDays,
      perDay: perDay, todayIds: todayIds, prevIds: prevIds, backlogIds: backlog,
      isFirstDay: dayIndex === 0, finished: dayIndex >= totalDays,
      start: start, today: today
    };
  }

  /* 어제 완료분 복습을 통과해야 오늘 진도가 열린다 */
  function gate(cfg) {
    cfg = cfg || {};
    var done = cfg.done || {};
    var reviewLog = cfg.reviewLog || {};
    var today = cfg.today;
    var dayIndex = cfg.dayIndex || 0;
    var prevIds = cfg.prevIds || [];
    var prevDone = prevIds.filter(function (id) { return !!done[id]; });
    var rl = reviewLog && reviewLog[today];
    var reviewed = !!(rl && rl.ok);
    var needReview = dayIndex >= 1 && prevDone.length > 0 && !reviewed;
    return { prevDone: prevDone, reviewed: reviewed, needReview: needReview, canAdvance: !needReview };
  }

  return {
    pick: pick, plan: plan, gate: gate, poolSize: poolSize,
    shuffle: shuffle, norm: norm, hash: hash,
    fromGen: fromGen, addDays: addDays, daysBetween: daysBetween, ymd: ymd, parseDay: parseDay
  };
});

{id:'parts-of-speech',tier:'basic',icon:'🅰️',title:'알파벳과 품사',sub:'명사·동사·형용사·부사 구별',concept:'영어 단어는 문장에서 하는 일에 따라 8가지 품사로 나뉩니다. 품사를 알면 빈칸에 들어갈 단어의 형태를 미리 짐작할 수 있습니다.',formula:'명사(이름) · 대명사(대신함) · 동사(동작/상태) · 형용사(명사 꾸밈) · 부사(동사·형용사 꾸밈) · 전치사 · 접속사 · 감탄사',points:['-ly로 끝나는 단어는 대부분 부사 (quickly, slowly, badly)','-ness, -tion, -ment, -ity로 끝나면 명사 (happiness, decision)','명사 앞에서 꾸미면 형용사, 동사 뒤에서 꾸미면 부사'],examples:[['She is a kind teacher.','그녀는 친절한 선생님이다. (kind = 형용사)'],['He runs quickly.','그는 빠르게 달린다. (quickly = 부사)']],tip:'빈칸 앞뒤를 보고 품사를 먼저 판단하면 답의 절반이 보입니다.'},
{id:'sentence-elements',tier:'basic',icon:'🧩',title:'문장의 구성 요소',sub:'주어·동사·목적어·보어·수식어',concept:'영어 문장은 주어와 동사를 뼈대로 하고, 동사의 종류에 따라 목적어나 보어가 따라붙습니다. 이 뼈대를 알면 1~5형식이 저절로 이해됩니다.',formula:'주어(S) + 동사(V) + [목적어(O) / 보어(C)] + 수식어(M)',points:['주어 = 동작하는 사람·것, 동사 = 동작·상태','목적어 = 동사의 대상 (~을/를)','보어 = 주어나 목적어의 상태·신분을 설명 (~이다/하게)','수식어 = 없어도 문장이 성립하는 꾸밈말 (부사구, 전명구)'],examples:[['She is a teacher.','그녀는 선생님이다. (a teacher = 주격 보어)'],['They play soccer in the park.','그들은 공원에서 축구를 한다. (in the park = 수식어)']],tip:'동사 뒤에 명사가 오면 목적어인지 보어인지 먼저 확인하세요. be동사·감각동사·become 뒤는 보어입니다.'},
{id:'subject-verb',tier:'basic',icon:'🔗',title:'주어와 동사',sub:'주어-동사 수일치',concept:'동사는 주어의 인칭과 수에 맞춰 모양이 달라집니다. 특히 현재시제에서 주어가 3인칭 단수이면 동사에 -s를 붙입니다.',formula:'3인칭 단수 주어(he/she/it/Tom/the dog) → 동사 + (e)s',points:['I / You / We / They → 동사원형','He / She / It / 단수명사 → 동사 + s','be동사: I am, You/We/They are, He/She/It is','everybody, each of, the number of → 단수 취급','shoes, pants, police → 복수 취급'],examples:[['She speaks English well.','그녀는 영어를 잘한다. (She → speaks)'],['The number of students is 300.','학생 수는 300명이다. (the number → is)']],tip:'주어와 동사 사이에 긴 수식어가 있어도 수는 진짜 주어에 맞춥니다.'},
{id:'noun-pronoun',tier:'basic',icon:'🏷️',title:'명사와 대명사',sub:'셀 수 있는 명사 / 없는 명사',concept:'명사는 셀 수 있는 명사와 셀 수 없는 명사로 나뉘고, 대명사는 명사를 대신합니다. 셀 수 없는 명사는 복수형·a/an을 쓰지 않습니다.',formula:'셀 수 있는 명사: a book / two books · 셀 수 없는 명사: information, advice, water, bread',points:['information, advice, news, furniture, homework는 셀 수 없음','셀 수 없는 명사의 양은 a piece of, a bottle of, some으로 표현','복수형 규칙: -s / -es / y→ies / f→ves / 불규칙(children, feet, mice)'],examples:[['Can you give me some advice?','조언 좀 해 줄래? (advices ✗)'],['I need two slices of bread.','빵 두 조각이 필요해.']],tip:'information, advice, news는 시험에 거의 매번 나오는 셀 수 없는 명사입니다.'},
{id:'articles',tier:'basic',icon:'🔤',title:'관사 (a, an, the)',sub:'부정관사와 정관사',concept:'a/an은 처음 나오는 셀 수 있는 단수 명사 앞에, the는 이미 알려진 특정한 것 앞에 씁니다.',formula:'a + 자음소리 / an + 모음소리 / the + 특정한 것 / 무관사 + 일반적 복수·추상명사',points:['소리 기준: an hour, an honest boy, a university, a one-euro coin','악기 앞 the (play the piano), 운동경기 무관사 (play soccer)','by bus, go to school, go to bed는 무관사 관용 표현','the + 형용사 = ~한 사람들 (the rich)','same 앞에는 항상 the'],examples:[['He is an honest boy.','그는 정직한 소년이다. (honest는 h를 발음하지 않음)'],['The sun rises in the east.','해는 동쪽에서 뜬다.']],tip:'a/an은 철자가 아니라 첫 소리로 결정합니다. hour, honest, university, one을 조심하세요.'},
{id:'be-verb',tier:'basic',icon:'🅱️',title:'be동사',sub:'am / is / are / was / were',concept:'be동사는 주어의 상태·신분·위치를 나타내며, 뒤에 명사나 형용사가 옵니다. 현재형은 am/is/are, 과거형은 was/were입니다.',formula:'주어 + be동사 + 명사/형용사 · 부정: be + not · 의문: Be + 주어 ~?',points:['I am / He, She, It, 단수명사 is / You, We, They, 복수명사 are','과거: I, He, She, It → was / You, We, They → were','의문문은 be동사를 주어 앞으로 이동 (Are you happy?)','There is + 단수, There are + 복수'],examples:[['I am a middle school student.','나는 중학생이다.'],['Were you at the park yesterday?','너 어제 공원에 있었니?']],tip:'be동사 뒤에 동사원형이 오면 안 됩니다. I am go ✗ → I go ✓'}

{id:'general-verb',tier:'basic',icon:'🏃',title:'일반동사',sub:'do / does / did',concept:'일반동사는 be동사가 아닌 모든 동사입니다. 부정문과 의문문을 만들 때 do/does/did의 도움을 받습니다.',formula:'현재: 동사원형 / 3인칭 단수 + (e)s · 과거: -ed 또는 불규칙 · 부정: do/does/did + not + 동사원형',points:['의문문: Do/Does/Did + 주어 + 동사원형?','do를 쓰면 뒤 동사는 반드시 원형 (Did you see? ✓ / Did you saw? ✗)','불규칙 동사: go-went, buy-bought, find-found, lose-lost, take-took'],examples:[['He does not like fish.','그는 생선을 좋아하지 않는다.'],['Did you see the movie?','너 그 영화 봤니?']],tip:'do/does/did가 나오면 뒤에는 무조건 동사원형이라고 기억하세요.'},
{id:'personal-pronoun',tier:'basic',icon:'👤',title:'인칭대명사',sub:'주격·목적격·소유격·소유대명사',concept:'같은 사람이라도 문장에서의 자리에 따라 대명사의 모양이 달라집니다.',formula:'주격(I) - 목적격(me) - 소유격(my) - 소유대명사(mine) - 재귀대명사(myself)',points:['주어 자리 → 주격 (He is kind.)','동사·전치사 뒤 → 목적격 (I like him. / with me)','명사 앞 → 소유격 (my book)','명사 없이 단독 → 소유대명사 (It is mine.)','주어와 같은 대상이 다시 나오면 재귀대명사 (He hurt himself.)'],examples:[['This bag is mine.','이 가방은 내 것이다.'],['She made the cake herself.','그녀가 직접 케이크를 만들었다.']],tip:'전치사 뒤에는 반드시 목적격이 옵니다. between you and me ✓'}

{id:'demonstrative',tier:'basic',icon:'👉',title:'지시대명사',sub:'this / that / these / those',concept:'지시대명사는 가까운 것과 먼 것, 단수와 복수를 구분해 가리킵니다.',formula:'가까운 단수 this · 가까운 복수 these · 먼 단수 that · 먼 복수 those',points:['this/these = 말하는 사람 가까이, that/those = 멀리','앞에 나온 명사를 다시 받을 때 that(단수)/those(복수)','상대방이 한 말을 받을 때 That sounds good.','These days = 요즘, That is why = 그런 이유로'],examples:[['These are my friends.','이들은 내 친구들이다.'],['The weather of Seoul is warmer than that of Busan.','서울 날씨가 부산 날씨보다 따뜻하다.']],tip:'비교 구문에서 앞의 명사를 대신 받는 that/those는 최고 빈출 포인트입니다.'},
{id:'plural',tier:'basic',icon:'🔢',title:'명사의 복수형',sub:'-s / -es / 불규칙',concept:'셀 수 있는 명사가 둘 이상이면 복수형으로 바꿉니다. 규칙 변화와 불규칙 변화를 모두 알아야 합니다.',formula:'-s / -es / y→ies / f,fe→ves / 불규칙(man-men, child-children, mouse-mice)',points:['-s, -x, -ch, -sh → -es (boxes, watches, buses)','자음 + y → ies (babies), 모음 + y → -s (boys)','-f, -fe → ves (knives, leaves)','단·복수형이 같은 명사: sheep, deer, fish','불규칙: man-men, woman-women, tooth-teeth, foot-feet, mouse-mice'],examples:[['There are three children in the room.','방에 아이 세 명이 있다.'],['I bought two knives.','나는 칼 두 자루를 샀다.']],tip:'potato/tomato/hero는 -es, photo/piano는 -s만 붙입니다.'},
{id:'tenses',tier:'mid2',icon:'⏰',title:'시제 (현재·과거·미래)',sub:'단순 현재 / 과거 / 미래',concept:'시제는 동작의 시간을 나타냅니다. 시간을 알려 주는 표현(yesterday, tomorrow, every day)을 함께 보면 답이 정해집니다.',formula:'현재: 동사원형/(e)s · 과거: -ed/불규칙 · 미래: will + 동사원형 / be going to + 동사원형',points:['every day, usually, always → 현재시제','yesterday, last week, ago, in 2020 → 과거시제','tomorrow, next week, in the future → 미래시제','시간·조건의 부사절에서는 미래 대신 현재시제 (When he comes, ~)'],examples:[['She goes to school every day.','그녀는 매일 학교에 간다.'],['I will visit my grandmother tomorrow.','나는 내일 할머니를 방문할 것이다.']],tip:'when, if, before, after 절 안에서는 will을 쓰지 않습니다.'},
{id:'present-progressive',tier:'mid2',icon:'▶️',title:'현재진행형',sub:'be + -ing',concept:'지금 이 순간 하고 있는 일을 나타냅니다. be동사와 동사원형-ing가 짝을 이룹니다.',formula:'주어 + am/is/are + 동사-ing',points:['now, right now, look!, listen! 과 함께 자주 씀','-ing 만드는 법: run→running, make→making, lie→lying','상태동사(know, like, want, have)는 진행형으로 잘 쓰지 않음','미래 계획: I am meeting him tomorrow.'],examples:[['She is reading a book now.','그녀는 지금 책을 읽고 있다.'],['They are playing soccer.','그들은 축구를 하고 있다.']],tip:'be동사를 빠뜨린 She reading ✗ 같은 형태가 가장 흔한 실수입니다.'},
{id:'past-progressive',tier:'mid2',icon:'⏪',title:'과거진행형',sub:'was/were + -ing',concept:'과거의 어느 시점에 계속하고 있던 동작을 나타냅니다. when 절(짧은 사건)과 함께 자주 쓰입니다.',formula:'주어 + was/were + 동사-ing',points:['at 7 yesterday, at that time, then 과 함께 씀','when + 과거시제(짧은 사건) / while + 과거진행(긴 동작)','I was / He was / They were'],examples:[['I was sleeping when you called me.','네가 전화했을 때 나는 자고 있었다.'],['While she was cooking, he was reading.','그녀가 요리하는 동안 그는 책을 읽고 있었다.']],tip:'while 뒤에는 진행형, when 뒤에는 과거시제가 오는 경우가 많습니다.'},
{id:'modal-verbs',tier:'mid2',icon:'🗝️',title:'조동사',sub:'can, may, must, should, will',concept:'조동사는 동사의 의미를 더해 줍니다. 조동사 뒤에는 항상 동사원형이 옵니다.',formula:'조동사 + 동사원형 (can swim ✓ / can swims ✗)',points:['can = ~할 수 있다 / may = ~해도 된다, ~일지도','must = ~해야 한다 / must not = ~하면 안 된다','should = ~해야 한다(충고) / had better = ~하는 게 좋다','must의 과거 대신 had to를 씀','조동사 + not + 동사원형 (부정문), 조동사 + 주어 + 동사원형 (의문문)'],examples:[['You should see a doctor.','너는 의사에게 진찰을 받아야 해.'],['He can speak three languages.','그는 세 개 언어를 말할 수 있다.']],tip:'must not(금지)과 don\'t have to(필요 없음)는 뜻이 정반대입니다.'},
{id:'questions-negatives',tier:'mid2',icon:'❓',title:'의문문과 부정문',sub:'do / be / 의문사',concept:'의문문은 be동사나 조동사를 주어 앞으로 보내고, 일반동사는 do/does/did를 앞세웁니다. 의문사가 있으면 문장 맨 앞에 둡니다.',formula:'(의문사) + Be/조동사/Do + 주어 + (동사원형)?',points:['be동사 의문문: Are you tired?','일반동사 의문문: Do you like it? / Does he know? / Did she go?','의문사: what, who, when, where, why, how','부정문: be + not / do + not + 동사원형'],examples:[['Where did you buy that?','그걸 어디서 샀니?'],['She does not like coffee.','그녀는 커피를 좋아하지 않는다.']],tip:'의문문에서 did를 쓰면 뒤 동사는 원형입니다. Where did you went? ✗'}
,
{id:'imperative-exclamatory',tier:'mid2',icon:'❗',title:'명령문과 감탄문',sub:'동사원형 / What·How',concept:'명령문은 주어 You를 생략하고 동사원형으로 시작합니다. 감탄문은 What(명사 강조) 또는 How(형용사·부사 강조)로 시작합니다.',formula:'명령: (Please) + 동사원형 ~. · 금지: Don\'t + 동사원형 ~. · 감탄: What (a/an) + 명사! / How + 형용사!',points:['Let us(Let\'s) + 동사원형 = ~하자','부정 명령: Don\'t be late. / Never do that.','What a beautiful flower! (단수 가산명사)','How beautiful! / How fast he runs!'],examples:[['Please open the window.','창문을 열어 주세요.'],['What a nice day it is!','정말 좋은 날이다!']],tip:'감탄문에서 What 뒤에는 명사, How 뒤에는 형용사/부사가 옵니다.'},
{id:'five-forms',tier:'mid2',icon:'🖐️',title:'5형식 문장',sub:'목적격 보어',concept:'동사의 종류에 따라 문장은 5가지 형식으로 나뉩니다. 5형식은 목적어 뒤에 목적격 보어가 오는 구조입니다.',formula:'1형식 S+V / 2형식 S+V+C / 3형식 S+V+O / 4형식 S+V+IO+DO / 5형식 S+V+O+OC',points:['2형식 동사: be, become, seem, look, feel, sound, taste, smell','4형식 동사: give, send, show, tell, buy, make (사람+물건)','5형식 동사: make, call, name, find, keep, leave (목적어+보어)','5형식 목적격 보어: 명사 / 형용사 / to부정사 / 동사원형 / 분사'],examples:[['I made him happy.','나는 그를 행복하게 만들었다. (5형식)'],['She gave me a pen.','그녀는 나에게 펜을 주었다. (4형식)']],tip:'동사 뒤에 명사가 두 개 연달아 오면 4형식, 명사+형용사가 오면 5형식입니다.'},
{id:'to-infinitive',tier:'mid2',icon:'🎯',title:'to부정사',sub:'명사적·형용사적·부사적 용법',concept:'to + 동사원형은 문장에서 명사, 형용사, 부사 역할을 모두 할 수 있습니다.',formula:'to + 동사원형',points:['명사적: 주어·목적어·보어 (To study is fun. / I want to go.)','형용사적: 명사 뒤에서 꾸밈 (something to eat)','부사적: 목적(~하기 위해), 감정의 원인, 결과','의문사 + to부정사: how to swim, what to do','want/hope/plan/decide + to부정사'],examples:[['I want to be a doctor.','나는 의사가 되고 싶다.'],['He went to the store to buy milk.','그는 우유를 사러 가게에 갔다.']],tip:'want, hope, decide, plan 뒤에는 동명사가 아니라 to부정사가 옵니다.'},
{id:'gerund',tier:'mid2',icon:'🔄',title:'동명사',sub:'동사-ing를 명사처럼',concept:'동사원형-ing는 명사처럼 주어·목적어·보어로 쓰일 수 있습니다.',formula:'동명사 = 동사-ing (명사 역할)',points:['주어: Swimming is good for health.','목적어: I enjoy reading.','전치사 뒤: I am good at singing.','동명사를 목적어로 쓰는 동사: enjoy, finish, mind, avoid, give up, look forward to','to부정사와 동명사 둘 다 쓰는 동사: like, love, start, begin'],examples:[['Reading books is fun.','책 읽는 것은 재미있다.'],['She finished writing the report.','그녀는 보고서 쓰기를 끝냈다.']],tip:'전치사 뒤에는 항상 동명사입니다. look forward to ~ing를 통째로 외우세요.'},
{id:'comparison',tier:'mid2',icon:'📈',title:'비교급과 최상급',sub:'-er / -est / more / most',concept:'두 대상을 비교하면 비교급, 셋 이상 중 최고를 말하면 최상급을 씁니다.',formula:'비교급 + than / the + 최상급 + of(in) / as + 원급 + as',points:['짧은 형용사: -er, -est (tall-taller-tallest)','긴 형용사: more, most (more beautiful)','불규칙: good-better-best, bad-worse-worst, many-more-most','비교급 강조: much, far, a lot, even, still','최상급 앞에는 the, of/in + 범위'],examples:[['He is taller than me.','그는 나보다 키가 크다.'],['This is the most interesting book I have ever read.','이것은 내가 읽은 가장 재미있는 책이다.']],tip:'비교급과 최상급을 함께 쓰는 실수(more taller)를 조심하세요.'},
{id:'passive',tier:'mid2',icon:'🔁',title:'수동태',sub:'be + 과거분사',concept:'주어가 동작을 하는 것이 아니라 동작을 받을 때 수동태를 씁니다.',formula:'주어 + be + 과거분사 (+ by 행위자)',points:['능동 → 수동: 목적어를 주어로, 동사를 be+p.p.로','시제는 be동사로 조절 (is made / was made / will be made)','by + 행위자는 필요 없으면 생략','과거분사: made, written, broken, stolen, built'],examples:[['This book was written by him.','이 책은 그에 의해 쓰였다.'],['English is spoken in many countries.','영어는 많은 나라에서 사용된다.']],tip:'수동태에서는 be동사의 시제만 바꾸면 되고 p.p.는 그대로 둡니다.'},
{id:'conjunctions',tier:'mid2',icon:'🌉',title:'접속사',sub:'when, because, if, that',concept:'접속사는 단어와 단어, 문장과 문장을 연결합니다. 뜻에 따라 시간·이유·조건·결과를 나타냅니다.',formula:'접속사 + 주어 + 동사',points:['시간: when, while, before, after, until, as soon as','이유: because, since, as','조건: if, unless','결과·양보: so, but, although, though','that: I think that he is right. (목적절)'],examples:[['I stayed home because it was raining.','비가 와서 나는 집에 있었다.'],['Call me when you arrive.','도착하면 전화해.']],tip:'because와 so는 한 문장에 함께 쓰지 않습니다.'},
{id:'prepositions',tier:'mid2',icon:'📍',title:'전치사',sub:'시간·장소·방향',concept:'전치사는 명사 앞에서 시간·장소·방향·이유 등을 나타냅니다. 관용 표현으로 굳어진 짝을 함께 외워야 합니다.',formula:'전치사 + 명사(상당어구)',points:['시간: at(시각) / on(요일·날짜) / in(월·년·계절)','장소: at(지점) / on(표면) / in(공간)','방향: to, into, onto, from','기간: for + 기간 / during + 명사 / in + 기간(미래)','관용: be good at, be interested in, be afraid of, look after'],examples:[['I was born in 2010.','나는 2010년에 태어났다.'],['She is good at math.','그녀는 수학을 잘한다.']],tip:'at/on/in은 시간과 장소 양쪽에 쓰이므로 각각의 기준을 표로 정리해 두세요.'},
{id:'there-is',tier:'mid2',icon:'🏠',title:'There is / There are',sub:'~이 있다',concept:'어떤 것이 존재한다는 뜻을 나타내는 구문입니다. 뒤에 오는 명사의 수에 맞춰 be동사를 고릅니다.',formula:'There is + 단수명사 / There are + 복수명사',points:['첫 번째 명사에 수를 맞춤 (There is a pen and two books.)','의문문: Is there ~? / Are there ~?','부정: There is not any ~ / There are no ~','There is + 셀 수 없는 명사 (There is some milk.)'],examples:[['There are many students in the library.','도서관에 많은 학생이 있다.'],['Is there a bank near here?','이 근처에 은행이 있나요?']],tip:'There is/are 뒤에 명사가 두 개면 첫 번째 명사에 맞춥니다.'},
{id:'sense-verbs',tier:'mid2',icon:'👀',title:'감각동사',sub:'look, sound, smell, taste, feel',concept:'감각동사는 눈·귀·코·혀·피부로 느낀 상태를 나타내며, 뒤에 형용사가 옵니다.',formula:'감각동사 + 형용사 / 감각동사 + like + 명사',points:['look(보이다), sound(들리다), smell(냄새나다), taste(맛나다), feel(느껴지다)','뒤에는 부사가 아니라 형용사 (looks happy ✓ / looks happily ✗)','명사가 오면 like를 붙임 (tastes like honey)','2형식 동사로 주격 보어를 취함'],examples:[['The soup smells good.','그 수프는 냄새가 좋다.'],['It sounds like a good idea.','그것은 좋은 생각처럼 들린다.']],tip:'look happily처럼 부사를 쓰면 동작을 꾸미는 뜻이 되어 어색해집니다.'},
{id:'dative-verbs',tier:'mid2',icon:'🎁',title:'수여동사',sub:'4형식과 3형식 전환',concept:'수여동사는 사람에게 무엇을 주는 것을 나타내며, 간접목적어(사람)와 직접목적어(물건)를 가집니다.',formula:'S + V + IO(사람) + DO(물건) → S + V + DO + to/for + IO',points:['to를 쓰는 동사: give, send, show, tell, teach, lend, pass','for를 쓰는 동사: buy, make, cook, get, find','4형식 동사는 3형식으로 바꿀 수 있음','explain, suggest는 4형식으로 쓰지 않음'],examples:[['She gave me a book.','그녀는 나에게 책을 주었다.'],['She gave a book to me.','(3형식 전환)']],tip:'buy/make는 for, give/send는 to. 이 짝만 외워도 대부분 해결됩니다.'},
{id:'frequency-adverbs',tier:'mid2',icon:'📊',title:'빈도부사',sub:'always, usually, often, never',concept:'빈도부사는 얼마나 자주 하는지를 나타내며, 일반동사 앞·be동사 뒤에 옵니다.',formula:'일반동사 앞 / be동사·조동사 뒤',points:['always(100%) - usually - often - sometimes - seldom - never(0%)','위치: I always get up early. / She is always kind.','never는 부정어이므로 not과 함께 쓰지 않음','sometimes는 문장 앞이나 끝에도 올 수 있음'],examples:[['He usually walks to school.','그는 보통 걸어서 학교에 간다.'],['She is never late.','그녀는 절대 지각하지 않는다.']],tip:'빈도부사 위치 문제는 be동사 뒤, 일반동사 앞만 기억하면 됩니다.'},
{id:'adjective-adverb',tier:'mid2',icon:'🎨',title:'형용사와 부사',sub:'꾸미는 대상 구별',concept:'형용사는 명사를, 부사는 동사·형용사·다른 부사를 꾸밉니다. 한국어 해석만으로는 구별이 어려우므로 꾸미는 대상을 확인해야 합니다.',formula:'형용사 + 명사 / 동사 + 부사',points:['명사 앞 또는 be동사·감각동사 뒤 → 형용사','동사·형용사·부사 앞뒤 → 부사','good(형용사) / well(부사), fast는 둘 다 가능','hard(열심히) / hardly(거의 ~않다)는 뜻이 다름','-ly가 붙어도 형용사인 경우: friendly, lovely, lonely'],examples:[['She is a careful driver.','그녀는 신중한 운전자다.'],['She drives carefully.','그녀는 신중하게 운전한다.']],tip:'명사가 있으면 형용사, 없으면 부사라고 먼저 판단하세요.'},
{id:'present-perfect',tier:'mid3',icon:'✅',title:'현재완료',sub:'have/has + 과거분사',concept:'현재완료는 과거의 일이 현재와 연결되는 것을 나타냅니다. 완료·경험·계속·결과 네 가지 뜻이 있습니다.',formula:'have/has + 과거분사',points:['완료: just, already, yet (I have just finished.)','경험: ever, never, before, twice (Have you ever been~?)','계속: for + 기간, since + 시점 (I have lived here for 3 years.)','결과: She has gone to Paris. (가서 지금 없음)','과거를 나타내는 yesterday, ago, last week와는 함께 쓰지 않음'],examples:[['I have never seen a ghost.','나는 유령을 본 적이 없다.'],['He has lived in Seoul since 2015.','그는 2015년부터 서울에 살고 있다.']],tip:'have been to(~에 가 본 적 있다)와 have gone to(~에 가 버렸다)를 구별하세요.'},
{id:'relative-pronoun',tier:'mid3',icon:'🔍',title:'관계대명사',sub:'who, which, that, what',concept:'관계대명사는 두 문장을 하나로 연결하면서 앞의 명사(선행사)를 꾸밉니다.',formula:'선행사 + 관계대명사 + (불완전한) 문장',points:['who = 사람, which = 사물, that = 사람·사물, whose = 소유','관계대명사 뒤에는 불완전한 문장이 옴','목적격은 생략 가능 (the book (which) I bought)','what = the thing that (선행사 포함)','계속적 용법: , who ~ (그런데 그는 ~)'],examples:[['The man who lives next door is a teacher.','옆집에 사는 남자는 선생님이다.'],['This is what I want.','이것이 내가 원하는 것이다.']],tip:'관계대명사 뒤가 불완전하면 관계대명사, 완전하면 관계부사입니다.'},
{id:'relative-adverb',tier:'mid3',icon:'🧭',title:'관계부사',sub:'when, where, why, how',concept:'관계부사는 앞의 명사(선행사)를 꾸미면서 뒤에 완전한 문장이 옵니다. 선행사에 따라 which/that으로 바꿀 수 있습니다.',formula:'선행사 + 관계부사 + 완전한 문장',points:['when = 시간(the day when)','where = 장소(the house where)','why = 이유(the reason why)','how = 방법(the way how → the way로 쓰거나 how 단독)','the way how는 틀린 표현'],examples:[['This is the house where he was born.','이곳이 그가 태어난 집이다.'],['I remember the day when we first met.','우리가 처음 만난 날을 기억한다.']],tip:'선행사가 place면 where, time이면 when, reason이면 why라고 연결하면 쉽습니다.'},
{id:'participles',tier:'mid3',icon:'✂️',title:'분사',sub:'현재분사 / 과거분사',concept:'분사는 동사에서 나와 형용사처럼 명사를 꾸밉니다. 현재분사(-ing)는 능동·진행, 과거분사(p.p.)는 수동·완료의 뜻입니다.',formula:'현재분사(-ing) = ~하는 / 과거분사(p.p.) = ~된, ~해진',points:['감정: interesting(흥미로운) vs interested(흥미를 느끼는)','surprising/surprised, exciting/excited, boring/bored, tiring/tired','명사 앞: a sleeping baby / a broken window','명사 뒤: the people living here','보어: The news is surprising. / I am surprised.'],examples:[['The movie was boring, so I was bored.','영화가 지루해서 나는 지루했다.'],['This is a broken chair.','이것은 부서진 의자다.']],tip:'-ing는 원인(사물), p.p.는 감정을 느끼는 사람에 주로 씁니다.'},
{id:'participle-construction',tier:'mid3',icon:'🌿',title:'분사구문 기초',sub:'접속사 + 주어 생략',concept:'분사구문은 부사절의 접속사와 주어를 생략하고 동사를 -ing로 바꾼 표현입니다.',formula:'접속사 + 주어 + 동사 → (접속사 생략) + 동사-ing ~',points:['Because he was tired → Being tired, he went to bed.','시간: When I walked home → Walking home, I met him.','동시상황: He sat reading a book.','부정: Not knowing the answer, she kept silent.','분사구문의 주어는 주절의 주어와 같아야 함'],examples:[['Feeling tired, she went to bed early.','피곤해서 그녀는 일찍 잤다.'],['Walking in the park, I met my teacher.','공원을 걷다가 선생님을 만났다.']],tip:'분사구문 맨 앞에 Being이 오면 이유(~해서)로 해석하는 경우가 많습니다.'},
{id:'subjunctive',tier:'mid3',icon:'💭',title:'가정법 기초',sub:'가정법 과거·과거완료',concept:'가정법은 사실과 반대되는 상황을 가정합니다. 시제를 한 단계 과거로 물러서서 표현합니다.',formula:'If + 주어 + 과거형, 주어 + would/could + 동사원형 (가정법 과거) / If + had p.p., 주어 + would have p.p.',points:['가정법 과거 = 현재 사실의 반대','be동사는 주어와 관계없이 were를 씀 (If I were you)','가정법 과거완료 = 과거 사실의 반대','If 절의 if를 생략하면 Were I you ~ 처럼 도치','I wish + 가정법 = ~라면 좋을 텐데'],examples:[['If I were you, I would apologize.','내가 너라면 사과할 것이다.'],['If I had studied harder, I would have passed.','더 열심히 공부했더라면 합격했을 텐데.']],tip:'If I was가 아니라 If I were가 시험에 나오는 이유는 가정법이기 때문입니다.'},
{id:'indirect-question',tier:'mid3',icon:'🤔',title:'간접의문문',sub:'의문사 + 주어 + 동사',concept:'의문문이 다른 문장 안에 들어가면 어순이 평서문처럼 바뀝니다. 의문사가 접속사 역할을 합니다.',formula:'의문사 + 주어 + 동사 (~인지)',points:['Do you know where he lives? (where does he live ✗)','if/whether = ~인지 아닌지 (I wonder if he is coming.)','의문대명사 who가 주어면 어순 유지 (who is there)','think, know, wonder, ask, tell + 간접의문문'],examples:[['Do you know what this is?','이게 뭔지 아니?'],['I wonder if she likes me.','그녀가 나를 좋아하는지 궁금하다.']],tip:'간접의문문 안에서는 do/does/did를 쓰지 않습니다.'},
{id:'causative',tier:'mid3',icon:'🛠️',title:'사역동사',sub:'make / have / let + 동사원형',concept:'사역동사는 남에게 어떤 일을 시키는 것을 나타냅니다. 목적격 보어로 동사원형이 옵니다.',formula:'make/have/let + 목적어 + 동사원형 · get + 목적어 + to부정사 · help + (to) 동사원형',points:['make = 강제로 ~하게 하다','have = 시켜서 ~하게 하다','let = 허락하여 ~하게 하다','get은 to부정사를 씀 (get him to do)','수동태: be made to do (to가 살아남)'],examples:[['My mom made me clean my room.','엄마가 나를 방 청소하게 했다.'],['Let me help you.','내가 너를 도와줄게.']],tip:'사역동사 뒤 동사원형, get 뒤 to부정사. 딱 두 가지만 구별하면 됩니다.'},
{id:'perception',tier:'mid3',icon:'👂',title:'지각동사',sub:'see / hear + 목적어 + 동사원형·-ing',concept:'지각동사는 보고·듣고·느끼는 것을 나타냅니다. 목적격 보어로 동사원형(전체 동작) 또는 현재분사(진행 중)가 옵니다.',formula:'see/hear/watch/feel + 목적어 + 동사원형(원형) 또는 -ing(진행)',points:['동사원형 = 처음부터 끝까지 하는 것을 봄','-ing = 하고 있는 도중을 봄','수동태에서는 to부정사로 바뀜 (be seen to do)','look at, listen to도 같은 구조로 쓸 수 있음'],examples:[['I saw him cross the street.','나는 그가 길을 건너는 것을 보았다.'],['I heard her singing.','나는 그녀가 노래하고 있는 것을 들었다.']],tip:'지각동사 뒤에는 to부정사를 쓰지 않습니다. saw him to cross ✗'}
,
{id:'passive-advanced',tier:'mid3',icon:'🔂',title:'수동태 심화',sub:'4·5형식과 조동사 수동태',concept:'4형식과 5형식 문장, 조동사가 있는 문장도 수동태로 바꿀 수 있습니다. 목적어를 주어로 옮기는 원리는 같습니다.',formula:'조동사 + be + p.p. / be + p.p. + to부정사 (5형식)',points:['4형식: He was given a book. / A book was given to him.','5형식: He was made to work. (to가 살아남)','조동사: This must be done today.','진행형: The house is being built.','완료형: The work has been finished.'],examples:[['The letter has been sent.','그 편지는 보내졌다.'],['He was seen to enter the room.','그가 방에 들어가는 것이 보였다.']],tip:'5형식 수동태에서 make/see/hear 뒤에는 to를 반드시 붙입니다.'},
{id:'to-inf-advanced',tier:'mid3',icon:'🎯',title:'to부정사 심화',sub:'의미상 주어·원형부정사',concept:'to부정사의 의미상 주어와, to 없이 쓰는 원형부정사까지 알아야 문장 구조가 정확히 보입니다.',formula:'for + 목적격 + to부정사 / of + 목적격 + to부정사 / 조동사·사역·지각 + 동사원형',points:['의미상 주어: It is hard for him to understand.','성격·성질 형용사: It is kind of you to help me.','원형부정사: 조동사, 사역동사, 지각동사 뒤','too ~ to부정사 = 너무 ~해서 ...할 수 없다','enough to / so ~ as to'],examples:[['It is important for us to protect nature.','우리가 자연을 보호하는 것은 중요하다.'],['It was kind of her to help me.','나를 도와주다니 그녀는 친절했다.']],tip:'for는 일반적 의미상 주어, of는 사람의 성격을 평가하는 형용사(kind, nice, foolish)와 씁니다.'},
{id:'gerund-advanced',tier:'mid3',icon:'🔄',title:'동명사 심화',sub:'동명사의 의미상 주어와 관용 표현',concept:'동명사에도 의미상 주어가 있고, 전치사와 결합한 관용 표현이 많습니다. 시제와 수동태도 표현할 수 있습니다.',formula:'소유격/목적격 + 동명사 / having + p.p. / being + p.p.',points:['의미상 주어: I don\'t mind his(him) coming late.','완료동명사: having finished (끝낸 것)','수동동명사: being loved','관용: be used to ~ing, look forward to ~ing, feel like ~ing, cannot help ~ing','동명사만 목적어로: enjoy, mind, avoid, give up, postpone'],examples:[['I am used to getting up early.','나는 일찍 일어나는 것에 익숙하다.'],['I cannot help laughing.','나는 웃지 않을 수 없다.']],tip:'be used to ~ing(익숙하다)와 used to 동사원형(예전에 ~했다)을 구별하세요.'},
{id:'conjunction-advanced',tier:'mid3',icon:'🧵',title:'접속사 심화',sub:'상관접속사·부사절',concept:'상관접속사는 짝을 이루어 쓰이고, 수일치는 뒤에 가까운 명사에 맞춥니다. 부사절 접속사는 시간·조건을 나타냅니다.',formula:'both A and B / either A or B / neither A nor B / not only A but also B / B as well as A',points:['both A and B → 복수 취급','either A or B, neither A nor B, not only A but also B → B에 수 일치','unless = if not, as long as = ~하는 한','although/though + 문장 (despite + 명사)','so ~ that / such ~ that (~해서 ...하다)'],examples:[['Not only he but also his friends are coming.','그뿐 아니라 그의 친구들도 오고 있다.'],['Although it was raining, we went out.','비가 왔지만 우리는 나갔다.']],tip:'상관접속사의 수일치는 동사와 가까운 쪽(B)에 맞춘다는 점이 핵심입니다.'}

<script>
/* 문제 변형 생성기 — 단원별 템플릿. 각 함수는 {q,c[4],e,d} 반환 (c[0]=정답) */
(function () {
  'use strict';
  var P = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  function Q(stem, correct, wrong, ex, d) {
    return { q: stem, c: [correct].concat(wrong), e: ex, d: d || 2 };
  }
  function R(rows) { var r = P(rows); return { q: r[0], c: [r[1], r[2], r[3], r[4]], e: r[5], d: 2 }; }

  var VB = [

    { b: 'study', s: 'studies', ing: 'studying', past: 'studied', pp: 'studied', o: 'English' },
    { b: 'watch', s: 'watches', ing: 'watching', past: 'watched', pp: 'watched', o: 'TV' },
    { b: 'read', s: 'reads', ing: 'reading', past: 'read', pp: 'read', o: 'books' },
    { b: 'cook', s: 'cooks', ing: 'cooking', past: 'cooked', pp: 'cooked', o: 'dinner' },
    { b: 'wash', s: 'washes', ing: 'washing', past: 'washed', pp: 'washed', o: 'the dishes' },
    { b: 'fix', s: 'fixes', ing: 'fixing', past: 'fixed', pp: 'fixed', o: 'bikes' },
    { b: 'clean', s: 'cleans', ing: 'cleaning', past: 'cleaned', pp: 'cleaned', o: 'the room' },
    { b: 'buy', s: 'buys', ing: 'buying', past: 'bought', pp: 'bought', o: 'a new bag' },
    { b: 'make', s: 'makes', ing: 'making', past: 'made', pp: 'made', o: 'a cake' },
    { b: 'write', s: 'writes', ing: 'writing', past: 'wrote', pp: 'written', o: 'a letter' },
    { b: 'take', s: 'takes', ing: 'taking', past: 'took', pp: 'taken', o: 'the bus' },
    { b: 'find', s: 'finds', ing: 'finding', past: 'found', pp: 'found', o: 'the key' },
    { b: 'lose', s: 'loses', ing: 'losing', past: 'lost', pp: 'lost', o: 'his wallet' },
    { b: 'eat', s: 'eats', ing: 'eating', past: 'ate', pp: 'eaten', o: 'lunch' },
    { b: 'drink', s: 'drinks', ing: 'drinking', past: 'drank', pp: 'drunk', o: 'milk' },
    { b: 'go', s: 'goes', ing: 'going', past: 'went', pp: 'gone', o: 'to school' },
    { b: 'meet', s: 'meets', ing: 'meeting', past: 'met', pp: 'met', o: 'his friend' },
    { b: 'send', s: 'sends', ing: 'sending', past: 'sent', pp: 'sent', o: 'an email' },
    { b: 'build', s: 'builds', ing: 'building', past: 'built', pp: 'built', o: 'a house' },
    { b: 'teach', s: 'teaches', ing: 'teaching', past: 'taught', pp: 'taught', o: 'math' },
    { b: 'break', s: 'breaks', ing: 'breaking', past: 'broke', pp: 'broken', o: 'the window' },
    { b: 'run', s: 'runs', ing: 'running', past: 'ran', pp: 'run', o: 'in the park' },
    { b: 'swim', s: 'swims', ing: 'swimming', past: 'swam', pp: 'swum', o: 'in the pool' }
  ];
  var ADJ = [['happy', 'happier', 'happiest'], ['tall', 'taller', 'tallest'], ['busy', 'busier', 'busiest'], ['cold', 'colder', 'coldest'], ['kind', 'kinder', 'kindest'], ['fast', 'faster', 'fastest'], ['young', 'younger', 'youngest'], ['easy', 'easier', 'easiest'], ['big', 'bigger', 'biggest'], ['hot', 'hotter', 'hottest']];
  var LADJ = ['beautiful', 'interesting', 'difficult', 'expensive', 'important', 'careful', 'popular', 'delicious'];
  var NOUN = ['girl', 'boy', 'runner', 'singer', 'driver', 'student', 'teacher', 'player', 'worker', 'dancer'];
  var PLACE = ['the park', 'the library', 'the station', 'the market', 'the museum', 'the school', 'the airport', 'the beach', 'the zoo', 'the mall'];
  var CITY = ['Seoul', 'Busan', 'Daegu', 'Incheon', 'Jeju', 'Daejeon', 'Gwangju', 'Suwon'];
  var SENSE = ['look', 'sound', 'smell', 'taste', 'feel'];
  var G = {};

  /* ---------- 중1 기초 ---------- */
  G['parts-of-speech'] = [
    function () {
      var n = P(NOUN), t = P([['kind', 'kindly', 'kindness'], ['quick', 'quickly', 'quickness'], ['happy', 'happily', 'happiness'], ['careful', 'carefully', 'carefulness'], ['brave', 'bravely', 'bravery'], ['polite', 'politely', 'politeness']]);
      return Q('빈칸에 알맞은 것은? She is a ___ ' + n + '.', t[0], [t[1], t[2], 'to ' + t[0]], '명사 ' + n + ' 앞에는 형용사 ' + t[0] + '이(가) 옵니다.');

    function () {

      return Q('빈칸에 알맞은 것은? She ' + t[0] + ' ___ .', t[1], [t[2], t[3], 'to ' + t[1]], '동사 ' + t[0] + '를 꾸미는 부사 ' + t[1] + '이(가) 필요합니다.');
    },
    function () {
      return R([['다음 중 명사인 것은?', 'decision', 'decide', 'decisive', 'decisively', '-sion으로 끝나는 decision은 명사입니다.'],
        ['다음 중 형용사인 것은?', 'kind', 'kindly', 'kindness', 'unkindly', 'kind는 명사를 꾸미는 형용사입니다.'],
        ['다음 중 부사는?', 'happily', 'happy', 'happiness', 'happen', 'happily는 -ly가 붙은 부사입니다.'],
        ['다음 중 전치사는?', 'under', 'because', 'quickly', 'always', 'under는 위치를 나타내는 전치사입니다.'],
        ['다음 중 접속사는?', 'although', 'above', 'angry', 'always', 'although는 절을 이끄는 접속사입니다.'],
        ['다음 중 감탄사는?', 'Wow', 'When', 'Which', 'While', 'Wow는 감탄사입니다.'],
        ['-ly로 끝나지만 형용사인 것은?', 'friendly', 'quickly', 'badly', 'softly', 'friendly는 형용사입니다.']]);
    }
  ];

  G['sentence-elements'] = [
    function () {
      var t = P([['My brother plays the piano well.', 'My brother', 'plays', 'the piano'], ['She bought a new bag yesterday.', 'She', 'bought', 'a new bag'], ['The students studied English hard.', 'The students', 'studied', 'English'], ['Tom fixed the broken bike.', 'Tom', 'fixed', 'the broken bike'], ['My mom cooked dinner for us.', 'My mom', 'cooked', 'dinner']]);
      var k = P([0, 1, 2]), lab = ['주어', '동사', '목적어'][k], cor = t[k + 1];
      var w = [t[1], t[2], t[3]].filter(function (x) { return x !== cor; });
      return Q('다음 문장의 ' + lab + '는? ' + t[0], cor, w, '동사 ' + t[2] + '를 기준으로 ' + lab + '의 자리를 확인합니다.');
    },
    function () {
      var r = P([['The baby smiled.', '1형식'], ['She is a teacher.', '2형식'], ['I like apples.', '3형식'], ['He gave me a pen.', '4형식'], ['They made him happy.', '5형식'], ['This soup tastes good.', '2형식'], ['We call him Tom.', '5형식'], ['Birds fly.', '1형식']]);
      var all = ['1형식', '2형식', '3형식', '4형식', '5형식'].filter(function (x) { return x !== r[1]; });
      return Q('다음 문장은 몇 형식인가? ' + r[0], r[1], [all[0], all[1], all[2]], r[0] + '의 문장 성분을 세어 형식을 정합니다.', 3);
    },
    function () {
      var t = P([['He became a doctor.', 'a doctor', '보어'], ['They met at the station.', 'at the station', '수식어'], ['She looks happy.', 'happy', '보어'], ['We ate lunch at noon.', 'at noon', '수식어'], ['The sky turned gray.', 'gray', '보어'], ['My uncle lives in Busan.', 'in Busan', '수식어']]);
      var w = t[2] === '보어' ? ['주어', '목적어', '수식어'] : ['주어', '목적어', '보어'];
      return Q('다음 문장에서 「' + t[1] + '」의 역할은? ' + t[0], t[2], w, '없어도 문장이 성립하면 수식어, 주어의 상태를 채우면 보어입니다.');
    }
  ];

  G['subject-verb'] = [
    function () {
      var s = P(S3), v = P(VB);
      return Q('빈칸에 알맞은 것은? ' + s + ' ___ ' + v.o + ' every day.', v.s, [v.b, v.ing, 'to ' + v.b], '3인칭 단수 주어 ' + s + '에는 동사에 -s를 붙입니다.');
    },
    function () {
      var s = P(SP), v = P(VB);
      return Q('빈칸에 알맞은 것은? ' + s + ' ___ ' + v.o + ' on Sundays.', v.b, [v.s, v.ing, 'to ' + v.b], '복수 주어 ' + s + '에는 동사원형을 씁니다.');
    },
    function () {
      return R([['The number of students ___ 300.', 'is', 'are', 'were', 'be', 'the number of는 단수 취급합니다.'],
        ['A number of students ___ coming.', 'are', 'is', 'was', 'be', 'a number of는 복수 취급합니다.'],
        ['Every student ___ a book.', 'has', 'have', 'having', 'had', 'every + 단수명사는 단수 취급합니다.'],
        ['Each of the boys ___ a cap.', 'has', 'have', 'are', 'were', 'each of는 단수 취급합니다.'],
        ['The shoes ___ too small for me.', 'are', 'is', 'was', 'be', 'shoes는 복수 취급하는 명사입니다.'],
        ['The news ___ very sad.', 'is', 'are', 'were', 'be', 'news는 단수 취급합니다.'],
        ['Mathematics ___ my favorite subject.', 'is', 'are', 'were', 'be', '학문 이름은 단수 취급합니다.'],
        ['The police ___ looking for him.', 'are', 'is', 'be', 'been', 'police는 복수 취급합니다.']]);
    }
  ];

  G['noun-pronoun'] = [
    function () {
      var r = P([['information', '정보'], ['advice', '조언'], ['furniture', '가구'], ['homework', '숙제'], ['news', '소식'], ['money', '돈'], ['bread', '빵'], ['music', '음악']]);
      var w = P([['apple', 'idea', 'chair'], ['book', 'bag', 'pen'], ['cup', 'desk', 'egg'], ['car', 'dog', 'hour']]);
      return Q('다음 중 셀 수 없는 명사는?', r[0], w, r[0] + '(' + r[1] + ')는 셀 수 없어 복수형이나 a를 쓰지 않습니다.');
    },
    function () {

<script>
/* ===== English Grammar Lab : app.js ===== */
(function () {
  'use strict';

  var KEY = 'egl_v1';
  var UNITS = window.UNITS || [];
  var QS = (window.QUESTIONS || []).slice();
  var POOL = window.EGLPool;
  var DIFF = { 1: '쉬움', 2: '보통', 3: '어려움', 4: '심화' };
  var TIER = { basic: '기초', mid2: '중2 핵심', mid3: '중3 심화' };

  /* ---------- state ---------- */
  var S = load();
  function blank() {
    return {
      name: '학생', settings: { shuffle: true, timer: true, instant: true, optShuffle: true },
      progress: {}, wrong: {}, fav: [], words: [], memos: [], history: [],
      done: {}, planStart: null, perDay: 2, reviews: {}, seen: {}, reviewLog: {}
    };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      var d = JSON.parse(raw), b = blank();
      for (var k in b) if (!(k in d)) d[k] = b[k];
      for (var k2 in b.settings) if (!(k2 in d.settings)) d.settings[k2] = b.settings[k2];
      if (!d.done) d.done = {};
      if (!d.reviews) d.reviews = {};
      if (!d.seen) d.seen = {};
      if (!d.reviewLog) d.reviewLog = {};
      if (!d.perDay) d.perDay = 2;
      /* 예전 버전의 read 플래그를 수동 완료 기록으로 이전 */
      for (var uid in d.progress) {
        if (d.progress[uid] && d.progress[uid].read && !d.done[uid]) d.done[uid] = (d.history && d.history.length ? d.history[d.history.length - 1].ts.slice(0, 10) : '2026-01-01');
      }
      return d;
    } catch (e) { return blank(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('저장 공간이 부족해요'); }
  }
  function prog(id) {
    if (!S.progress[id]) S.progress[id] = { read: false, solved: 0, correct: 0, best: 0 };
    return S.progress[id];
  }
  function unitById(id) { for (var i = 0; i < UNITS.length; i++) if (UNITS[i].id === id) return UNITS[i]; return null; }
  function qByUnit(id) { return QS.filter(function (q) { return q.u === id; }); }

  /* ---------- utils ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pct(n, d) { return d ? Math.round(n / d * 100) : 0; }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var toastT;
  function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 1800); }

  /* ---------- derived stats ---------- */
  function overall() {
    var read = 0, solved = 0, correct = 0;
    UNITS.forEach(function (u) { if (S.done[u.id]) read++; var p = S.progress[u.id]; if (p) { solved += p.solved; correct += p.correct; } });
    return { read: read, units: UNITS.length, solved: solved, correct: correct, acc: pct(correct, solved) };
  }
  function studyDays() {
    var set = {}; S.history.forEach(function (h) { set[(h.ts || '').slice(0, 10)] = 1; });
    return Object.keys(set).length;
  }

  /* ---------- 일일 진도 ---------- */
  function unitIds() { return UNITS.map(function (u) { return u.id; }); }
  function todayState() {
    if (!S.planStart) { S.planStart = today(); save(); }
    var p = POOL.plan({ units: unitIds(), perDay: S.perDay || 2, start: S.planStart, today: today() });
    var g = POOL.gate({ done: S.done, reviewLog: S.reviewLog, today: today(), dayIndex: p.dayIndex, prevIds: p.prevIds });
    return { plan: p, lock: g, ids: p.todayIds };
  }
  function reviewTargets() {
    var st = todayState();
    var ids = st.plan.prevIds.filter(function (id) { return !!S.done[id]; });
    return { ids: ids, reviewed: st.lock.reviewed, needReview: st.lock.needReview, dayIndex: st.plan.dayIndex };
  }
  function reviewN(n) { return Math.max(5, Math.min(20, (n || 1) * 5)); }

  /* 매 시도마다 '다른 지문' 뽑기 */
  function buildList(cfg) {
    var units = cfg.units || unitIds();
    var n = cfg.n || 20;
    var gen = window.GEN || {};
    /* 단원 하나만 풀 때는 '지문 풀의 절반'만 출제 → 연속 두 번이면 겹치지 않음 */
    if (cfg.auto !== false && units.length === 1) {
      var size = POOL.poolSize(gen, QS, units[0]);
      n = Math.max(8, Math.min(20, Math.floor(size / 2)));
    }
    return POOL.pick({
      units: units, n: n, diff: cfg.diff || 0,
      staticBank: QS, gen: gen, seen: S.seen || {},
      optShuffle: S.settings.optShuffle
    });
  }
  function markSeen(list) {
    list.forEach(function (it) {
      var uid = it.q.u, stem = POOL.norm(it.q.q);
      if (!S.seen[uid]) S.seen[uid] = [];
      if (S.seen[uid].indexOf(stem) < 0) S.seen[uid].push(stem);
      if (S.seen[uid].length > 140) S.seen[uid] = S.seen[uid].slice(-140);
    });
    save();
  }

      '<div><label class="fl">제한 시간</label><div class="chips" id="t-chips">' +
      '<button class="chip on" data-t="0">없음</button>' +
      [5, 10, 15, 20, 30].map(function (m) { return '<button class="chip" data-t="' + m + '">' + m + '분</button>'; }).join('') + '</div></div>' +
      '</div>' +
      '<div style="margin-top:14px"><label class="fl">범위</label><div class="chips" id="r-chips">' +
      '<button class="chip on" data-r="all">전체</button>' +
      '<button class="chip" data-r="basic">중1 기초</button>' +
      '<button class="chip" data-r="mid2">중2 핵심</button>' +
      '<button class="chip" data-r="mid3">중3 심화</button></div></div>' +
      '<div class="row" style="margin-top:18px"><button class="btn primary" id="exam-start">시험 시작 →</button>' +
      '<span style="font-size:12px;color:#6b7a90">전체 문제 ' + QS.length + '개 중에서 출제</span></div></div>' +
      '<div class="card pad"><label class="fl">내 최고 기록</label>' +
      '<div class="tbl-wrap"><table><thead><tr><th>종류</th><th>점수</th><th>정답률</th><th>시간</th><th>날짜</th></tr></thead><tbody>' +
      (S.history.filter(function (h) { return h.type.indexOf('모의고사') === 0; }).slice(-5).reverse().map(function (h) {
        return '<tr><td>' + esc(h.type) + '</td><td><b>' + h.right + '/' + h.total + '</b></td><td>' + pct(h.right, h.total) + '%</td><td class="mono">' + mmss(h.sec) + '</td><td class="mono">' + h.ts.slice(0, 10) + '</td></tr>';
      }).join('') || '<tr><td colspan="5" style="color:#6b7a90">기록이 없습니다.</td></tr>') +
      '</tbody></table></div></div>';

    var nSel = 20, tSel = 0, rSel = 'all';
    $$('#n-chips .chip').forEach(function (b) { b.addEventListener('click', function () { nSel = +b.getAttribute('data-n'); $$('#n-chips .chip').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); }); });
    $$('#t-chips .chip').forEach(function (b) { b.addEventListener('click', function () { tSel = +b.getAttribute('data-t'); $$('#t-chips .chip').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); }); });
    $$('#r-chips .chip').forEach(function (b) { b.addEventListener('click', function () { rSel = b.getAttribute('data-r'); $$('#r-chips .chip').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); }); });
    $('#exam-start').addEventListener('click', function () {
      var us = UNITS.filter(function (u) { return rSel === 'all' || u.tier === rSel; }).map(function (u) { return u.id; });
      if (us.length < 1) { toast('문제가 부족해요'); return; }
      startSession({ mode: 'exam', title: '모의고사', units: us, n: nSel, instant: false, limit: tSel * 60 });
      if (session) { session.title = '모의고사 ' + session.list.length + '문제'; renderPlay(); }
    });
  }

  /* ================= QUIZ PLAYER ================= */
  function startSession(cfg) {
    var list;
    if (cfg.list) {
      list = cfg.list.slice();
      if (S.settings.shuffle) list = shuffle(list);
      list = list.map(function (q) {
        var order = q.c.map(function (_, i) { return i; });
        if (S.settings.optShuffle) order = shuffle(order);
        return { q: q, choices: order.map(function (i) { return q.c[i]; }), ans: order.indexOf(q.a) };
      });
    } else {
      list = buildList(cfg).map(function (q) { return { q: q, choices: q.c, ans: q.a }; });
      if (S.settings.shuffle && !cfg.keepOrder) list = shuffle(list);
      if (cfg.mode !== 'review') markSeen(list);
    }
    if (!list.length) { toast(cfg.diff ? '해당 난이도 문제가 없어요' : '문제를 찾지 못했어요'); return; }
    session = {
      mode: cfg.mode, title: cfg.title, instant: cfg.instant !== false,
      list: list, idx: 0, picks: list.map(function () { return null; }),
      startTs: Date.now(), limit: cfg.limit || 0, graded: false
    };
    if (location.hash !== '#/play') location.hash = '#/play';
    renderPlay();
  }

  function renderPlay() {
    if (!session) { location.hash = '#/quiz'; return; }
    if (session.graded) { renderResult(); return; }
    var it = session.list[session.idx], q = it.q, u = unitById(q.u);
    var picked = session.picks[session.idx];
    var showFb = session.instant && picked !== null;
    var answered = session.picks.filter(function (x) { return x !== null; }).length;

    $('#view').innerHTML =
      '<div class="row sp" style="margin-bottom:12px">' +
      '<div class="row"><a class="btn ghost sm" href="#/home" id="quit">✕ 나가기</a>' +
      '<span class="badge2">' + esc(session.title) + '</span>' +
      '<span class="pill soft">' + DIFF[q.d] + '</span></div>' +
      '<div class="row">' +
      '<span class="badge2 mono">' + (session.idx + 1) + ' / ' + session.list.length + '</span>' +
      (session.limit ? '<span class="timer" id="timer">' + mmss(session.limit) + '</span>' : '<span class="timer" id="timer">' + mmss(Math.floor((Date.now() - session.startTs) / 1000)) + '</span>') +
      '</div></div>' +

      '<div class="card qcard">' +
      '<div class="qmeta"><span class="pill ' + (u ? u.tier : 'soft') + '">' + (u ? esc(u.title) : '') + '</span>' +
      (session.instant ? '<span class="pill soft">즉시 해설</span>' : '<span class="pill soft">제출 후 채점</span>') + '</div>' +
      '<div class="qtext">' + esc(q.q) + '</div>' +
      (q.hint ? '<div class="qsub">' + esc(q.hint) + '</div>' : '<div class="qsub">알맞은 것을 고르세요.</div>') +
      '<div class="opts" id="opts">' + it.choices.map(function (c, i) {
        var cls = '';
        if (showFb) {
          if (i === it.ans) cls = 'right';
          else if (i === picked) cls = 'wrong';
        } else if (picked === i) cls = 'sel';
        return '<button class="opt ' + cls + (showFb ? ' locked' : '') + '" data-i="' + i + '"><span class="k">' + 'ABCD'[i] + '</span><span>' + esc(c) + '</span></button>';
      }).join('') + '</div>' +
      (showFb ? '<div class="fb ' + (picked === it.ans ? 'ok' : 'no') + '">' +
        (picked === it.ans ? '<b>정답입니다! 🎉</b>' : '<b>아쉬워요. 정답은 ' + 'ABCD'[it.ans] + '. ' + esc(it.choices[it.ans]) + '</b>') +
        '<span class="ex">' + esc(q.e) + '</span></div>' : '') +
      '<div class="qfoot">' +
      '<div class="row">' +
      '<button class="btn ghost sm" id="prev"' + (session.idx === 0 ? ' disabled' : '') + '>← 이전</button>' +
      (session.instant ? '<button class="btn ghost sm" id="show">해설 보기</button>' : '') +
      '</div>' +
      '<div class="row">' +
      (session.instant
        ? '<button class="btn primary" id="next">' + (session.idx === session.list.length - 1 ? '결과 보기' : '다음 문제 →') + '</button>'
        : (session.idx === session.list.length - 1
          ? '<button class="btn primary" id="submit">제출하고 채점</button>'
          : '<button class="btn primary" id="next">다음 →</button>')) +
      '</div></div>' +
      '<div class="qnav" id="qnav">' + session.list.map(function (_, i) {
        return '<button data-go="' + i + '" class="' + (session.picks[i] !== null ? 'done ' : '') + (i === session.idx ? 'cur' : '') + '">' + (i + 1) + '</button>';
      }).join('') + '</div>' +
      '</div>' +
      '<div class="row sp" style="margin-top:12px"><span style="font-size:12.5px;color:#6b7a90">진행 ' + answered + ' / ' + session.list.length + '</span>' +
      (session.instant ? '' : '<button class="btn ghost sm" id="submit2">전체 제출</button>') + '</div>';

    $$('#opts .opt').forEach(function (b) {
      b.addEventListener('click', function () {
        if (session.instant && session.picks[session.idx] !== null) return;
        session.picks[session.idx] = +b.getAttribute('data-i');
        if (session.instant) recordAnswer(session.list[session.idx], session.picks[session.idx]);
        renderPlay();
        if (session.instant && session.idx < session.list.length - 1 && session.list[session.idx].q.autoNext !== false) {
          setTimeout(function () {
            if (session && !session.graded && session.picks[session.idx] !== null) { session.idx++; renderPlay(); }
          }, 1400);
        }
      });
    });
    if ($('#show')) $('#show').addEventListener('click', function () {
      if (session.picks[session.idx] === null) { session.picks[session.idx] = -1; }
      session.instant = true; renderPlay();
    });
    if ($('#prev')) $('#prev').addEventListener('click', function () { if (session.idx > 0) { session.idx--; renderPlay(); } });
    if ($('#next')) $('#next').addEventListener('click', function () {
      if (session.instant && session.idx === session.list.length - 1) { finish(); return; }
      if (session.idx < session.list.length - 1) { session.idx++; renderPlay(); }
      else finish();
    });
    if ($('#submit')) $('#submit').addEventListener('click', function () { finish(); });
    if ($('#submit2')) $('#submit2').addEventListener('click', function () { finish(); });
    $$('#qnav button').forEach(function (b) {
      b.addEventListener('click', function () { session.idx = +b.getAttribute('data-go'); renderPlay(); });
    });
    if ($('#quit')) $('#quit').addEventListener('click', function () { session = null; stopTimer(); });
    startTimer();
  }

  function recordAnswer(item, pick) {
    var q = item.q, p = prog(q.u);
    p.solved++; item.recorded = true;
    if (pick === item.ans) {
      p.correct++;
      if (S.wrong[q.id] && !S.wrong[q.id].resolved) {
        S.wrong[q.id].resolved = true;
        S.wrong[q.id].ts = new Date().toISOString();
      }
    } else {
      p.correct += 0;
      var w = S.wrong[q.id] || { n: 0, resolved: false };
      w.n = (w.n || 0) + 1; w.resolved = false; w.ts = new Date().toISOString(); w.u = q.u;
      w.q = { u: q.u, d: q.d, q: q.q, c: item.choices ? item.choices.slice() : (q.c || []).slice(), a: item.ans != null ? item.ans : q.a, e: q.e, id: q.id };
      S.wrong[q.id] = w;
    }
    save();
  }

  function finish() {
    if (!session) return;
    var right = 0;
    session.list.forEach(function (it, i) {
      if (!it.recorded) { recordAnswer(it, session.picks[i]); }
      if (session.picks[i] === it.ans) right++;
    });
    session.graded = true;
    session.right = right;
    session.sec = Math.floor((Date.now() - session.startTs) / 1000);
    stopTimer();
    if (location.hash !== '#/play') location.hash = '#/play';
    var type = session.mode === 'exam' ? '모의고사' : session.mode === 'wrong' ? '오답 복습' : session.mode === 'review' ? '어제 복습' : session.mode === 'daily' ? '오늘의 진도' : '단원 문제';
    S.history.push({ ts: new Date().toISOString(), type: type + ' (' + session.title + ')', total: session.list.length, right: right, sec: session.sec });
    if (S.history.length > 200) S.history = S.history.slice(-200);
    /* best score per unit */
    var byUnit = {};
    session.list.forEach(function (it, i) {
      var u = it.q.u;
      byUnit[u] = byUnit[u] || { t: 0, r: 0 };
      byUnit[u].t++; if (session.picks[i] === it.ans) byUnit[u].r++;
    });
    Object.keys(byUnit).forEach(function (u) {
      var p = prog(u), p2 = pct(byUnit[u].r, byUnit[u].t);
      if (p2 > (p.best || 0)) p.best = p2;
    });
    if (session.mode === 'review') {
      var rate = pct(right, session.list.length);
      var prev = S.reviewLog[today()];
      var ok = rate >= 60;
      if (ok || !prev || !prev.ok) {
        S.reviewLog[today()] = { ts: new Date().toISOString(), right: right, total: session.list.length, rate: rate, ok: ok };
      }
      session.reviewOk = ok;
      session.reviewRate = rate;
    }
    save();
    renderResult();
  }

  function renderResult() {
    var total = session.list.length, right = session.right, p2 = pct(right, total);
    var grade = p2 >= 95 ? 'A+' : p2 >= 90 ? 'A' : p2 >= 80 ? 'B' : p2 >= 70 ? 'C' : p2 >= 60 ? 'D' : 'F';
    var wrongIdx = session.list.map(function (it, i) { return session.picks[i] === it.ans ? -1 : i; }).filter(function (i) { return i >= 0; });

    $('#view').innerHTML =
      '<div class="card pad" style="text-align:center;background:linear-gradient(160deg,#eef4ff,#fff);border-color:#dbe7ff">' +
      '<div style="font-size:12px;font-weight:800;color:#6b7a90">' + esc(session.title) + '</div>' +
      '<div style="font-size:52px;font-weight:800;letter-spacing:-3px;color:#1d4ed8;margin:6px 0">' + p2 + '<span style="font-size:22px">점</span></div>' +
      '<div class="row" style="justify-content:center;gap:10px">' +
      '<span class="badge2">정답 ' + right + ' / ' + total + '</span>' +
      '<span class="badge2">등급 ' + grade + '</span>' +
      '<span class="badge2">시간 ' + mmss(session.sec) + '</span></div>' +
      '<div class="row" style="justify-content:center;margin-top:18px">' +
      '<a class="btn primary" href="#/home">홈으로</a>' +
      (wrongIdx.length ? '<button class="btn ghost" id="again-wrong">틀린 ' + wrongIdx.length + '문제 다시 풀기</button>' : '') +
      '<a class="btn ghost" href="#/stats">통계 보기</a></div></div>' +

      '<div class="sec-h"><h2>문항별 결과</h2><span class="line"></span><small>틀린 문제는 오답 노트에 저장됩니다</small></div>' +
      '<div class="grid" style="gap:10px">' + session.list.map(function (it, i) {
        var ok = session.picks[i] === it.ans, u = unitById(it.q.u);
        var myPick = session.picks[i] >= 0 ? it.choices[session.picks[i]] : '(선택 안 함)';
        return '<div class="card pad" style="border-left:4px solid ' + (ok ? '#12a150' : '#e2413f') + '">' +
          '<div class="row sp"><div class="row"><b style="font-size:12px;color:#6b7a90">' + (i + 1) + '번</b>' +
          '<span class="pill soft">' + (u ? esc(u.title) : '') + '</span></div>' +
          '<span style="font-weight:800;font-size:12px;color:' + (ok ? '#12a150' : '#e2413f') + '">' + (ok ? '정답' : '오답') + '</span></div>' +
          '<div style="margin-top:6px;font-weight:700">' + esc(it.q.q) + '</div>' +
          '<div style="margin-top:6px;font-size:13px;color:#3d4a60">정답: <b style="color:#0d7a3d">' + esc(it.choices[it.ans]) + '</b>' +
          (ok ? '' : ' · 내 답: <span style="color:#c02b29">' + esc(myPick) + '</span>') + '</div>' +
          '<div style="margin-top:8px;font-size:13px;color:#5b6a80;background:#f7f9fd;border-radius:9px;padding:9px 11px">' + esc(it.q.e) + '</div>' +
          '</div>';
      }).join('') + '</div>';

    if ($('#again-wrong')) $('#again-wrong').addEventListener('click', function () {
      var list = wrongIdx.map(function (i) { return session.list[i].q; });
      startSession({ mode: 'wrong', title: '틀린 문제 다시 풀기', list: list, instant: true });
    });
  }

  /* ---------- timer ---------- */
  function startTimer() {
    stopTimer();
    if (!session) return;
    timerId = setInterval(function () {
      if (!session || session.graded) { stopTimer(); return; }
      var el = $('#timer'); if (!el) return;
      if (session.limit) {
        var left = session.limit - Math.floor((Date.now() - session.startTs) / 1000);
        if (left <= 0) { el.textContent = '00:00'; stopTimer(); toast('시간 종료! 자동 채점합니다'); finish(); return; }
        el.textContent = mmss(left);
        if (left <= 30) el.classList.add('warn');
      } else {
        el.textContent = mmss(Math.floor((Date.now() - session.startTs) / 1000));
      }
    }, 500);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  /* ================= WRONG NOTE ================= */
  function renderWrong() {
    var ids = Object.keys(S.wrong);
    var list = ids.map(function (id) { var w = S.wrong[id]; return { id: id, q: (w && w.q) || QS.find(function (x) { return String(x.id) === id; }), w: w }; })
      .filter(function (o) { return o.q; })
      .sort(function (a, b) { return (b.w.resolved ? 0 : 1) - (a.w.resolved ? 0 : 1) || b.w.n - a.w.n; });
    var open = list.filter(function (o) { return !o.w.resolved; });

    $('#view').innerHTML =
      '<div class="card pad" style="margin-bottom:14px;background:linear-gradient(160deg,#fff3f3,#fff);border-color:#fad4d3">' +
      '<div class="row sp"><div><b style="font-size:16px">❌ 오답 ' + open.length + '개</b>' +
      '<div style="font-size:12.5px;color:#6b7a90;margin-top:3px">틀린 문제는 자동 저장되고, 복습에서 맞히면 완료 처리됩니다.</div></div>' +
      '<div class="row">' +
      '<button class="btn primary' + (open.length ? '' : '" disabled') + '" id="wrong-exam">오답만 모아 풀기 (' + open.length + ')</button>' +
      '<button class="btn ghost sm" id="wrong-clear">완료 항목 정리</button></div></div></div>' +
      (list.length ? '<div class="grid" style="gap:10px">' + list.map(function (o) {
        var u = unitById(o.q.u);
        return '<div class="card pad" style="' + (o.w.resolved ? 'opacity:.62' : '') + '">' +
          '<div class="row sp"><div class="row"><span class="pill ' + (u ? u.tier : 'soft') + '">' + (u ? esc(u.title) : '') + '</span>' +
          '<span class="badge2">' + DIFF[o.q.d] + '</span>' +
          (o.w.resolved ? '<span class="done-tag">복습 완료</span>' : '<span style="font-size:11.5px;font-weight:800;color:#e2413f">' + o.w.n + '번 틀림</span>') +
          '</div><a class="btn ghost sm" href="#/unit/' + o.q.u + '">개념 보기</a></div>' +
          '<div style="margin-top:8px;font-weight:700">' + esc(o.q.q) + '</div>' +
          '<div style="margin-top:6px;font-size:13px;color:#3d4a60">정답: <b style="color:#0d7a3d">' + esc(o.q.c[o.q.a]) + '</b></div>' +
          '<div style="margin-top:8px;font-size:13px;color:#5b6a80;background:#f7f9fd;border-radius:9px;padding:9px 11px">' + esc(o.q.e) + '</div>' +
          '<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-resolve="' + o.id + '">' + (o.w.resolved ? '다시 복습하기' : '복습 완료 처리') + '</button></div>' +
          '</div>';
      }).join('') + '</div>'
        : '<div class="card"><div class="empty"><span class="e">✨</span>오답이 없어요. 문제를 풀면 틀린 문제가 자동으로 쌓입니다.</div></div>');

    if ($('#wrong-exam')) $('#wrong-exam').addEventListener('click', function () {
      if (!open.length) return;
      startSession({ mode: 'wrong', title: '오답 노트 복습', list: open.map(function (o) { return o.q; }), instant: S.settings.instant });
    });
    if ($('#wrong-clear')) $('#wrong-clear').addEventListener('click', function () {
      var n = 0;
      Object.keys(S.wrong).forEach(function (k) { if (S.wrong[k].resolved) { delete S.wrong[k]; n++; } });
      save(); toast(n + '개 항목을 정리했어요'); renderWrong(); renderTop();
    });
    $$('[data-resolve]').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-resolve');
        if (!S.wrong[k]) return;
        S.wrong[k].resolved = !S.wrong[k].resolved;
        save(); renderWrong(); renderTop();
      });
    });
  }

  /* ================= WORDS ================= */
  var wordQ = '';
  function renderWords() {
    var list = S.words.filter(function (w) { return !wordQ || (w.w + w.m).toLowerCase().indexOf(wordQ.toLowerCase()) >= 0; });
    $('#view').innerHTML =
      '<div class="card pad" style="margin-bottom:14px">' +
      '<label class="fl">단어 추가</label>' +
      '<div class="row"><input type="text" id="w-en" placeholder="영어 단어 (예: available)" style="flex:2;min-width:150px">' +
      '<input type="text" id="w-ko" placeholder="뜻 (예: 이용 가능한)" style="flex:2;min-width:150px">' +
      '<button class="btn primary" id="w-add">저장</button></div>' +
      '<div class="row" style="margin-top:12px"><input type="text" id="w-q" placeholder="단어 검색" value="' + esc(wordQ) + '" style="flex:1">' +
      '<span class="badge2">총 ' + S.words.length + '개</span></div></div>' +
      (list.length ? '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>단어</th><th>뜻</th><th>등록일</th><th></th></tr></thead><tbody>' +
        list.slice().reverse().map(function (w, i) {
          return '<tr><td><b>' + esc(w.w) + '</b></td><td>' + esc(w.m) + '</td><td class="mono" style="color:#6b7a90">' + w.ts.slice(0, 10) + '</td>' +
            '<td style="text-align:right"><button class="btn ghost sm" data-del="' + esc(w.w) + '">삭제</button></td></tr>';
        }).join('') + '</tbody></table></div></div>'
        : '<div class="card"><div class="empty"><span class="e">📚</span>저장한 단어가 없어요. 모르는 단어를 적어 두세요.</div></div>');

    $('#w-add').addEventListener('click', function () {
