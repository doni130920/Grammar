          '<div><b style="font-size:14px">' + esc(u.title) + '</b>' +
          '<div style="font-size:11.5px;color:#6b7a90">' + TIER[u.tier] + ' · ' + esc(u.sub) + '</div></div></div>' +
          '<div class="row"><a class="btn ghost sm" href="#/unit/' + id + '">개념</a>' +
          '<button class="btn ' + (dn ? 'ghost' : 'primary') + ' sm" data-daydone="' + id + '">' + (dn ? '완료 취소' : '학습완료') + '</button></div></div>';
      }).join('') : '<div class="empty">일정이 끝났어요. 아래 「다시 시작」으로 새 일정을 만드세요.</div>') +
      '<div class="row" style="margin-top:12px"><button class="btn primary" id="day-quiz">오늘 단원 문제 풀기 (' + p.todayIds.length * 10 + '문제)</button>' +
      '<span style="font-size:12px;color:#6b7a90">매번 다른 문제 지문으로 출제됩니다.</span></div></div>' +

      '<div class="sec-h"><h2>어제 복습</h2><span class="line"></span><small>' + (p.dayIndex > 0 ? 'Day ' + p.dayNo - 1 : '첫날') + '</small></div>' +
      '<div class="card pad" style="margin-bottom:14px">' +
      (rv.ids.length
        ? '<div class="row sp"><div><b style="font-size:14px">' + rv.ids.length + '단원 · ' + reviewN(rv.ids.length) + '문제</b>' +
          '<div style="font-size:12.5px;color:#6b7a90;margin-top:3px">' + (rv.reviewed ? '✅ 오늘 복습 완료 (' + (rlog ? rlog.rate + '%' : '통과') + ')' : '60% 이상이면 통과 — 통과해야 오늘 진도가 열립니다.') + '</div>' +
          '<div class="row" style="margin-top:8px">' + rv.ids.map(function (id) { var u = unitById(id); return u ? '<span class="dchip">' + u.icon + ' ' + esc(u.title) + '</span>' : ''; }).join('') + '</div></div>' +
          '<button class="btn ' + (rv.reviewed ? 'ghost' : 'primary') + '" id="rev-start">' + (rv.reviewed ? '다시 복습' : '복습 시작 →') + '</button></div>'
        : '<div class="empty">아직 복습할 어제 단원이 없어요. 내일부터 어제 배운 단원 복습이 열립니다.</div>') +
      '</div>' +

      (backlog.length ? '<div class="sec-h"><h2>밀린 단원</h2><span class="line"></span><small>' + backlog.length + '개</small></div>' +
        '<div class="card pad" style="margin-bottom:14px"><div class="row" style="gap:6px">' + backlog.map(function (id) {
          var u = unitById(id); return u ? '<a class="dchip" href="#/unit/' + id + '" style="text-decoration:none">' + u.icon + ' ' + esc(u.title) + '</a>' : '';
        }).join('') + '</div><div style="font-size:12px;color:#6b7a90;margin-top:8px">지난 날짜에 완료하지 못한 단원입니다. 순서대로 따라잡아 보세요.</div></div>' : '') +

      '<div class="sec-h"><h2>전체 일정</h2><span class="line"></span><small>' + p.totalDays + '일</small></div>' +
      '<div class="card pad"><div class="tbl-wrap"><table><thead><tr><th>Day</th><th>날짜</th><th>단원</th></tr></thead><tbody>' + schedule + '</tbody></table></div></div>';

    $$('#pd-chips .chip').forEach(function (b) {
      b.addEventListener('click', function () {
        S.perDay = +b.getAttribute('data-pd'); save(); renderDaily(); renderTop();
        toast('하루 ' + S.perDay + '단원으로 바꿨어요');
      });
    });
    if ($('#pd-reset')) $('#pd-reset').addEventListener('click', function () {
      S.planStart = today(); save(); renderDaily(); toast('오늘부터 Day 1로 다시 시작합니다');
    });
    if ($('#day-quiz')) $('#day-quiz').addEventListener('click', function () {
      if (!p.todayIds.length) { toast('오늘 배울 단원이 없어요'); return; }
      startSession({ mode: 'daily', title: 'Day ' + p.dayNo + ' 오늘의 진도', units: p.todayIds, n: Math.max(10, p.todayIds.length * 10), instant: S.settings.instant });
    });
    if ($('#rev-start')) $('#rev-start').addEventListener('click', function () {
      startSession({ mode: 'review', title: '어제 복습', units: rv.ids, n: reviewN(rv.ids.length), instant: S.settings.instant });
    });
    $$('[data-daydone]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-daydone');
        if (S.done[id]) { delete S.done[id]; toast('완료를 취소했어요'); }
        else {
          var st2 = todayState();
          if (st2.lock.needReview) { toast('어제 복습을 먼저 통과해 주세요 🔒'); location.hash = '#/review'; return; }
          S.done[id] = today(); toast('학습완료! 오늘 진도에 기록했어요 🎉');
        }
        save(); renderTop(); renderDaily();
      });
    });
  }

  /* ================= REVIEW GATE ================= */
  function renderReview() {
    var rv = reviewTargets();
    var rlog = S.reviewLog[today()];
    var st = todayState();
    var prev = st.plan.prevIds;

    $('#view').innerHTML =
      '<div class="card pad" style="margin-bottom:14px;background:linear-gradient(160deg,#fffbf0,#fff);border-color:#f6e6bf">' +
      '<h2 style="font-size:18px;letter-spacing:-.4px">🔁 어제 복습</h2>' +
      '<p style="font-size:13px;color:#6b7a90;margin-top:4px">어제 완료한 단원에서 문제가 출제됩니다. <b>60% 이상</b>이면 통과, 통과해야 오늘 진도(학습완료)가 열립니다.</p>' +
      '<div class="row" style="margin-top:12px">' +
      (rv.ids.length ? '<button class="btn primary" id="rev-go">복습 퀴즈 시작 (' + reviewN(rv.ids.length) + '문제)</button>' : '') +
      '<a class="btn ghost sm" href="#/daily">일일 진도로 →</a></div></div>' +

      '<div class="grid g3" style="margin-bottom:14px">' +
      tile('복습 대상', rv.ids.length + '<small>단원</small>', '') +
      tile('오늘 상태', rv.reviewed ? '통과' : '대기', rv.reviewed ? 'blue' : '') +
      tile('통과 기준', '60<small>%</small>', '') +
      '</div>' +

      (prev.length ? '<div class="card pad" style="margin-bottom:14px"><label class="fl">어제 완료한 단원</label>' +
        '<div class="row" style="gap:6px;margin-top:6px">' + prev.map(function (id) {
          var u = unitById(id); if (!u) return '';
          var dn = !!S.done[id];
          return '<a class="dchip' + (dn ? ' ok' : '') + '" href="#/unit/' + id + '" style="text-decoration:none">' + (dn ? '✓ ' : '○ ') + u.icon + ' ' + esc(u.title) + '</a>';
        }).join('') + '</div>' +
        '<div style="font-size:12px;color:#6b7a90;margin-top:8px">✓ 표시는 어제 완료한 단원입니다. 완료한 단원만 복습 문제가 나옵니다.</div></div>'
        : '<div class="card"><div class="empty"><span class="e">🌱</span>첫날이에요. 어제 배운 단원이 없어 복습 없이 진도를 나갈 수 있습니다.</div></div>') +

      '<div class="card pad"><label class="fl">최근 복습 기록</label>' +
      (Object.keys(S.reviewLog).filter(function (k) { return S.reviewLog[k]; }).sort().slice(-7).reverse().map(function (k) {
        var r = S.reviewLog[k];
        return '<div class="row sp" style="padding:8px 0;border-bottom:1px solid #eef2f8"><span class="mono" style="font-size:12.5px">' + k + '</span>' +
          '<span><b>' + r.right + '/' + r.total + '</b> <span class="badge2">' + r.rate + '%</span> ' +
          (r.ok ? '<span class="done-tag">통과</span>' : '<span style="font-size:11.5px;font-weight:800;color:#e2413f">미통과</span>') + '</span></div>';
      }).join('') || '<div style="font-size:12.5px;color:#6b7a90;padding:6px 0">아직 복습 기록이 없어요.</div>') + '</div>';

    if ($('#rev-go')) $('#rev-go').addEventListener('click', function () {
      startSession({ mode: 'review', title: '어제 복습', units: rv.ids, n: reviewN(rv.ids.length), instant: S.settings.instant });
    });
  }

  /* ================= boot ================= */
  /* assign stable ids */
  QS.forEach(function (q, i) { q.id = q.u + '-' + i; });
  window.__EGL = { units: UNITS, questions: QS };
  if (!location.hash) location.hash = '#/home';
  route();
})();

</script>
</body>
</html>
